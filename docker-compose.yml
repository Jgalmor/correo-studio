services:
  correo-studio:
    build: .
    restart: unless-stopped
    init: true
    read_only: true
    ports:
      - "127.0.0.1:8765:8765"
    labels:
      - traefik.enable=true
      - traefik.docker.network=root_default
      - traefik.http.routers.correo-studio.rule=Host(`correo-studio.compararprecio.com`)
      - traefik.http.routers.correo-studio.entrypoints=websecure
      - traefik.http.routers.correo-studio.tls=true
      - traefik.http.routers.correo-studio.tls.certresolver=mytlschallenge
      - traefik.http.services.correo-studio.loadbalancer.server.port=8765
    networks:
      - default
      - root_default
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  root_default:
    external: true
