services:
  correo-studio:
    build: .
    restart: unless-stopped
    init: true
    read_only: true
    ports:
      - "127.0.0.1:8765:8765"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
